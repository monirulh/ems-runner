# Runner settings. Change values here (or override in ~/.skysoft/ems-runner.ini); no code change needed.

[paths]
# project_root defaults to two folders above this runner (erp_dashboard_dev)
project_root =
collab_dir = docs/collab
master_plan = docs/research/EMS_Phase_List_Master.md
backlog_dir = docs/backlog
skyui_dir = apps/skyui

[project]
owner_name = Monirul Hasan

[session]
# default working time when you run `ems start` without --for/--until
default_hours = 5
# after the session time ends, the current task may finish for this long before it is interrupted
grace_minutes = 15
# a single run longer than this counts as a failure (then retry/escalation)
max_task_minutes = 120

[models]
# AUTO-Q2 model table (DM-1 split). Edit to change; `ems unblock <task> --model opus` overrides one task.
default = sonnet
group_design = opus
phase_plan = opus
review = opus
build = sonnet
test = sonnet
apply = sonnet
qa = sonnet
docs = sonnet
fix = sonnet
merge = sonnet
skyui = sonnet
po = haiku
handover = haiku
inbox = haiku

[max_turns]
default = 80
group_design = 60
phase_plan = 30
review = 50
build = 120
fix = 120
po = 40
handover = 20
inbox = 20

[escalation]
# failures on the task's model before it moves to opus; same error twice also escalates
failures_before_escalation = 2
# attempts on opus before the task is blocked for the owner
opus_attempts = 1

[review]
max_rounds = 2

[limits]
# when a limit gives no reset time: check again after this long
poll_minutes = 30
# wait this long after the announced reset before starting again
resume_margin_minutes = 5
service_backoff_minutes = 5, 15, 30
probe_host = api.anthropic.com

[daemon]
poll_seconds = 10
keep_awake = yes

[agent]
# cli_path is set in ~/.skysoft/ems-runner.ini (outside the repo), e.g. /usr/local/bin/<cli>
cli_path =
permission_mode = acceptEdits
allowed_tools = Read,Edit,Write,Glob,Grep,Bash
permission_prompts_none = yes
use_guard = yes
extra_args =

[guard]
deny_rules = Read(source_snapshot/education/**), Edit(docs/research/**), Edit(docs/collab/approvals/**)

[verify]
# commands a phase plan may ask the runner to run itself as proof of "done"
allowed_prefixes = infra/scripts/dc.sh , infra/scripts/shell.sh , node qa/ , python3 qa/ , python3 -m pytest , flutter test , flutter analyze , dart test , git -C , test -f , test -d , ls
timeout_minutes = 40

[git]
# repos to checkpoint; empty = every git repo in apps/ plus docs/ if it is one
repos =
checkpoint_branch_prefixes = phase/, skyui/
author_name = Monirul Hasan
author_email = 89monirulhasan@gmail.com

[notify]
macos = yes
telegram = yes
ntfy = yes
# info | urgent: the lowest level each channel receives
macos_min_level = info
telegram_min_level = info
ntfy_min_level = urgent
dry_run = no

[doctor]
min_free_gb = 40
